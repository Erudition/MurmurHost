services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: always
    volumes:
      - ./murmur.sqlite:/data/mumble-server.sqlite
      - ./murmur.ini:/etc/murmur.ini
    environment:
      - MUMBLE_CUSTOM_CONFIG_FILE=/etc/murmur.ini
    networks:
      - podcast-net

  mumo:
    build: ./bots/mumo
    restart: always
    volumes:
      - ./bots/mumo:/data
    depends_on:
      - murmur
    networks:
      - podcast-net

  custom-bots:
    build: ./bots
    container_name: custom-bots
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./recordings:/bots/recordings
      - ./bots/supervisor_bot.py:/bots/supervisor_bot.py
      - ./bots/echobot.py:/bots/echobot.py
      - ./bots/opus_recorder.py:/bots/opus_recorder.py
      - ./bots/test_bot.py:/bots/test_bot.py
      - ./bots/gemini-bot:/bots/gemini-bot
      - ./bots/certs:/bots/certs
      - ./bots/test-speech-clips:/bots/test-speech-clips
    restart: unless-stopped
    depends_on:
      - murmur
    networks:
      - podcast-net

  db-nextcloud:
    image: mariadb:10.11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ./nextcloud_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - podcast-net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - podcast-net

  nextcloud:
    image: nextcloud
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db-nextcloud
      - redis
    volumes:
      - ./nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db-nextcloud
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=adminpassword123
      - NEXTCLOUD_TRUSTED_DOMAINS=141.148.11.127 localhost
    networks:
      - podcast-net

networks:
  podcast-net:
    driver: bridge
