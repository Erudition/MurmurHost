services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: always
    volumes:
      - ./murmur.sqlite:/data/mumble-server.sqlite
      - ./murmur.ini:/etc/murmur.ini
    environment:
      - MUMBLE_CUSTOM_CONFIG_FILE=/etc/murmur.ini
    networks:
      - podcast-net

  mumo:
    build: ./bots/mumo
    restart: always
    volumes:
      - ./bots/mumo:/data
    depends_on:
      - murmur
    networks:
      - podcast-net

  bots-legacy:
    build: ./bots
    depends_on:
      - murmur
    restart: always
    volumes:
      - ./recordings:/bots/recordings
    networks:
      - podcast-net

  db-nextcloud:
    image: mariadb:10.11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ./nextcloud_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - podcast-net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - podcast-net

  nextcloud:
    image: nextcloud
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db-nextcloud
      - redis
    volumes:
      - ./nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db-nextcloud
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=adminpassword123
      - NEXTCLOUD_TRUSTED_DOMAINS=141.148.11.127 localhost
    networks:
      - podcast-net

networks:
  podcast-net:
    driver: bridge
