services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: unless-stopped
    volumes:
      - ./murmur.ini:/etc/murmur.ini
      - ./data:/var/lib/murmur
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "64738"]
      interval: 10s
      timeout: 5s
      retries: 5

  supervisor:
    build: ./bots/supervisor
    container_name: mumble-supervisor
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bots/supervisor/supervisor_bot.py:/bots/supervisor_bot.py
      - ./bots/supervisor/certs:/bots/certs
    restart: unless-stopped
    depends_on:
      murmur:
        condition: service_healthy

  echo-bot:
    build: ./bots/echo
    container_name: echo-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bots/echo/echobot.py:/bots/echobot.py
      - ./bots/echo/certs:/bots/certs
    restart: "no"

  benny-bot:
    build: ./bots/gemini
    container_name: benny-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./bots/gemini/pipecat_bot.py:/bots/pipecat_bot.py
      - ./bots/gemini/mumble_transport.py:/bots/mumble_transport.py
      - ./bots/gemini/certs:/bots/certs
    restart: "no"

  tester:
    build: ./bots/tester
    container_name: mumble-tester
    profiles: [ "debug" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bots/tester/main.py:/bots/main.py
      - ./bots/tester/clips:/bots/clips
      - ./bots/tester/certs:/bots/certs
    entrypoint: [ "python3", "/bots/main.py" ]
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
