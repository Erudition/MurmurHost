services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: "no"
    volumes:
      - ./murmur.sqlite:/data/mumble-server.sqlite
      - ./murmur.ini:/etc/murmur.ini
    environment:
      - MUMBLE_CUSTOM_CONFIG_FILE=/etc/murmur.ini
    networks:
      - podcast-net

  mumo:
    build: ./bots/mumo
    restart: "no"
    volumes:
      - ./bots/mumo:/data
    depends_on:
      - murmur
    networks:
      - podcast-net

  custom-bots:
    build: ./bots
    container_name: custom-bots
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./recordings:/bots/recordings
      - ./bots/supervisor_bot.py:/bots/supervisor_bot.py
      - ./bots/echobot.py:/bots/echobot.py
      - ./bots/opus_recorder.py:/bots/opus_recorder.py
      - ./bots/test_bot.py:/bots/test_bot.py
      - ./bots/gemini-bot:/bots/gemini-bot
      - ./bots/certs:/bots/certs
      - ./bots/test-speech-clips:/bots/test-speech-clips
    restart: "no"
    depends_on:
      - murmur
    networks:
      - podcast-net


networks:
  podcast-net:
    driver: bridge
