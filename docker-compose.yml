services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: unless-stopped
    volumes:
      - ./murmur.ini:/etc/murmur.ini
      - ./data:/var/lib/murmur
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/127.0.0.1/64738"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - podcast-net

  supervisor:
    build: ./bots/supervisor
    container_name: mumble-supervisor
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bots/supervisor/supervisor_bot.py:/bots/supervisor_bot.py
      - ./bots/supervisor/certs:/bots/certs
    restart: unless-stopped
    depends_on:
      murmur:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - podcast-net


  echo-bot:
    build: ./bots/echo
    container_name: echo-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bots/echo/echobot.py:/bots/echobot.py
      - ./bots/echo/certs:/bots/certs
    restart: "no"
    networks:
      - podcast-net

  benny-bot:
    build: ./gemini-bot
    container_name: benny-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./gemini-bot:/bots
    restart: "no"

    networks:
      - podcast-net

  tester:
    build: ./bots/tester
    container_name: mumble-tester
    profiles: [ "debug" ]
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bots/tester/main.py:/bots/main.py
      - ./bots/tester/clips:/bots/clips
      - ./bots/tester/certs:/bots/certs
    entrypoint: [ "python3", "/bots/main.py" ]
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    networks:
      - podcast-net

networks:
  podcast-net:
    name: ftpodcastmurmurhost_podcast-net
    external: true
