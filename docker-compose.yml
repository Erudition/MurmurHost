services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: unless-stopped
    volumes:
      # THE KEY: We only keep the stateful database here. 
      # The config file is baked into the image for Production authority.
      - ./murmur.sqlite:/var/lib/murmur/murmur.sqlite
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/127.0.0.1/64738"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - podcast-net

  supervisor:
    build: ./bots/supervisor
    container_name: mumble-supervisor
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bots/supervisor/supervisor_bot.py:/bots/supervisor_bot.py:ro
      - ./bots/supervisor/certs:/bots/certs:ro
    restart: unless-stopped
    depends_on:
      murmur:
        condition: service_healthy
    networks:
      - podcast-net

  benny-bot:
    build: ./gemini-bot
    container_name: benny-bot
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./gemini-bot:/bots:ro
    restart: unless-stopped
    networks:
      - podcast-net

networks:
  podcast-net:
    driver: bridge
