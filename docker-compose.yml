services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: unless-stopped
    volumes:
      - ./murmur.sqlite:/data/mumble-server.sqlite
      - ./murmur.ini:/etc/murmur.ini
    environment:
      - MUMBLE_CUSTOM_CONFIG_FILE=/etc/murmur.ini
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/64738'" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks:
      - podcast-net

  supervisor:
    build: ./bots/supervisor
    container_name: mumble-supervisor
    environment:
      - MUMBLE_HOST=127.0.0.1
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bots/supervisor/supervisor_bot.py:/bots/supervisor_bot.py
      - ./bots/supervisor/certs:/bots/certs
    restart: unless-stopped
    depends_on:
      murmur:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import json, time; d=json.load(open('/tmp/supervisor_health')); exit(0 if d['status']=='connected' and time.time()-d['timestamp']<15 else 1)" ]
      interval: 5s
      timeout: 2s
      retries: 3
    network_mode: service:murmur

  benny-bot:
    build: ./bots/gemini
    container_name: benny-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=127.0.0.1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./bots/gemini:/bots
      - ./bots/gemini/certs:/bots/certs
    restart: "no"
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    network_mode: service:murmur

  echo-bot:
    build: ./bots/echo
    container_name: echo-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=127.0.0.1
    volumes:
      - ./bots/echo/echobot.py:/bots/echobot.py
      - ./bots/echo/certs:/bots/certs
    restart: "no"
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    network_mode: service:murmur

  recording-bot:
    build: ./bots/recorder
    container_name: recording-bot
    profiles: [ "bots" ]
    environment:
      - MUMBLE_HOST=127.0.0.1
    volumes:
      - ./recordings:/bots/recordings
      - ./bots/recorder/opus_recorder.py:/bots/opus_recorder.py
      - ./bots/recorder/certs:/bots/certs
    restart: "no"
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    network_mode: service:murmur

  tester:
    build: ./bots/gemini
    container_name: mumble-tester
    profiles: [ "test" ]
    environment:
      - MUMBLE_HOST=127.0.0.1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./bots/tester/main.py:/bots/main.py
      - ./bots/tester/clips:/bots/clips
      - ./bots/tester/certs:/bots/certs
    entrypoint: [ "python3", "/bots/main.py" ]
    depends_on:
      murmur:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    network_mode: service:murmur

networks:
  podcast-net:
    driver: bridge
