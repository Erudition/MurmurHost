services:
  murmur:
    build: .
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    restart: unless-stopped
    volumes:
      - ./db:/var/lib/murmur
    healthcheck:
      test: ["CMD-SHELL", "pidof mumble-server > /dev/null"]
      interval: 1m
      start_period: 1m
      timeout: 10s
      retries: 3
    networks:
      - default

  supervisor:
    build: ./bots/supervisor
    container_name: mumble-supervisor
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    healthcheck:
      test: ["CMD-SHELL", "grep -q supervisor_bot.py /proc/1/cmdline"]
      interval: 1m
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      murmur:
        condition: service_started

  benny-bot:
    build: ./gemini-bot
    container_name: benny-bot
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    healthcheck:
      test: ["CMD-SHELL", "grep -q bot.py /proc/1/cmdline"]
      interval: 1m
      timeout: 5s
      retries: 3
    restart: unless-stopped

  echo-bot:
    build: ./bots/echo
    container_name: echo-bot
    environment:
      - MUMBLE_HOST=murmur
      - PYTHONUNBUFFERED=1
    restart: "no"
